name: freshness

# The staleness alarm for the published snapshot (DATA-GOVERNANCE-STANDARD
# DG-04, #25). Every 6 hours it fetches the file the app reads and the
# nightly `snapshot.yml` run history, and scripts/check_snapshot_freshness.py
# judges them:
#
#   - the file is older than 30 hours (a nightly run was missed): SEV3;
#   - the file is older than the data cards' 48-hour SLA: SEV2;
#   - the last completed nightly run on main did not succeed: SEV3;
#   - the file cannot be fetched or dated, or there is no run history: an
#     alarm too, because an unknown age is never "fresh".
#
# An alarm turns this run red. On a scheduled or dispatched run,
# scripts/freshness_issue.py then decides what happens to the one
# `snapshot freshness:` incident issue (DECISIONS 0066):
#
#   - stale and none open: open one with `incident` and its severity, or
#     reopen the last one this workflow closed if that was under 72 hours ago;
#   - stale and one open: comment only when the state changes (a new
#     severity or a new reason), never because the file got older;
#   - fresh and one open: say so once and close it. The postmortem is still
#     owed (docs/incidents/README.md);
#   - fresh and none open: nothing.
#
# The script's thresholds are tested against snapshot.yml's schedule and the
# data cards (tests/test_snapshot_freshness.py), and the issue decisions in
# tests/test_freshness_issue.py, both run by `make policy`. Before it checks
# anything, the job proves it can fail: a planted 2020 snapshot must make the
# script exit 1.

on:
  schedule:
    - cron: "47 */6 * * *" # 00:47, 06:47, 12:47, 18:47 UTC; off the hour
  workflow_dispatch: {}
  # Also when the check itself changes, so an edit is proven on its own pull
  # request. Those runs never open issues.
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/freshness.yml"
      - "scripts/check_snapshot_freshness.py"
      - "scripts/freshness_issue.py"
      - "tests/test_snapshot_freshness.py"
      - "tests/test_freshness_issue.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/freshness.yml"
      - "scripts/check_snapshot_freshness.py"
      - "scripts/freshness_issue.py"
      - "tests/test_snapshot_freshness.py"
      - "tests/test_freshness_issue.py"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

env:
  SNAPSHOT_URL: https://chelseakr.github.io/queer-tv-guide/snapshot.v1.json

jobs:
  check:
    name: snapshot freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # the snapshot workflow's run history (a private repository)
      issues: write # open or update the incident issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: self-test the checker
        run: |
          set -euo pipefail
          python3 -m unittest discover --start-directory tests --pattern test_snapshot_freshness.py --verbose
          python3 -m unittest discover --start-directory tests --pattern test_freshness_issue.py --verbose

      - name: negative control (a planted 2020 snapshot must raise the alarm)
        run: |
          set -euo pipefail
          control="$RUNNER_TEMP/control"
          mkdir -p "$control"
          printf '{"generated_at": "2020-01-01T00:00:00Z"}\n' > "$control/snapshot.json"
          printf '[{"databaseId": 1, "status": "completed", "conclusion": "success", "event": "schedule", "createdAt": "2020-01-01T00:00:00Z", "url": "none"}]\n' > "$control/runs.json"
          grep -qF '"2020-01-01T00:00:00Z"' "$control/snapshot.json"
          rc=0
          python3 scripts/check_snapshot_freshness.py \
            --snapshot "$control/snapshot.json" --runs "$control/runs.json" \
            --report "$control/report.md" > /dev/null || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "control: a 2020 snapshot must alarm (exit 1), got exit $rc" >&2
            exit 1
          fi
          grep -qF "ALARM (sev2)" "$control/report.md"
          echo "control: the planted 2020 snapshot raised a sev2 alarm"

      - name: fetch the published snapshot and the nightly run history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A failed fetch leaves no file, which the checker judges as an
          # unknown age: an alarm, never a pass.
          if ! curl --proto '=https' --tlsv1.2 -fsSL --max-redirs 3 --proto-redir =https --compressed --retry 3 --retry-all-errors \
              --max-time 120 -o "$RUNNER_TEMP/snapshot.v1.json" "$SNAPSHOT_URL"; then
            echo "::warning::could not fetch $SNAPSHOT_URL"
            rm -f "$RUNNER_TEMP/snapshot.v1.json"
          fi
          if ! gh run list --repo "$GITHUB_REPOSITORY" --workflow snapshot.yml --branch main --limit 20 \
              --json databaseId,status,conclusion,event,createdAt,url > "$RUNNER_TEMP/runs.json"; then
            echo "::warning::could not read the snapshot workflow's run history"
            rm -f "$RUNNER_TEMP/runs.json"
          fi

      - name: judge freshness
        id: verdict
        run: |
          set -euo pipefail
          rc=0
          python3 scripts/check_snapshot_freshness.py \
            --snapshot "$RUNNER_TEMP/snapshot.v1.json" --runs "$RUNNER_TEMP/runs.json" \
            --report "$RUNNER_TEMP/report.md" --github-output "$GITHUB_OUTPUT" || rc=$?
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: open, update or close the freshness incident issue
        if: ${{ !cancelled() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        env:
          GH_TOKEN: ${{ github.token }}
          ALARM: ${{ steps.verdict.outputs.alarm }}
          SEVERITY: ${{ steps.verdict.outputs.severity }}
          CODES: ${{ steps.verdict.outputs.codes }}
          TITLE: ${{ steps.verdict.outputs.title }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          # No verdict at all (a broken self-test, a crashed checker) is a
          # silenced gate: the script files it as SEV3, per the README.
          case "$ALARM" in
            true) state=alarm ;;
            false) state=fresh ;;
            *) state=no-verdict ;;
          esac
          gh issue list --repo "$GITHUB_REPOSITORY" --state all --label incident --limit 100 \
            --json number,title,state,closedAt > "$RUNNER_TEMP/incidents.json"
          number="$(python3 scripts/freshness_issue.py pick --issues "$RUNNER_TEMP/incidents.json")"
          if [ -n "$number" ]; then
            gh issue view "$number" --repo "$GITHUB_REPOSITORY" \
              --json number,state,closedAt,labels,body,comments > "$RUNNER_TEMP/issue.json"
          else
            echo null > "$RUNNER_TEMP/issue.json"
          fi
          body="$RUNNER_TEMP/issue-body.md"
          decision="$RUNNER_TEMP/decision.json"
          python3 scripts/freshness_issue.py decide --issue "$RUNNER_TEMP/issue.json" \
            --state "$state" --severity "$SEVERITY" --codes "$CODES" --title "$TITLE" \
            --report "$RUNNER_TEMP/report.md" --run-url "$RUN_URL" \
            --body "$body" --decision "$decision"
          action="$(jq -r .action "$decision")"
          case "$action" in
            none)
              echo "nothing to change: ${number:+#$number }already records this state" ;;
            create)
              gh issue create --repo "$GITHUB_REPOSITORY" --title "$(jq -r .title "$decision")" \
                --label incident --label "$(jq -r .severity "$decision")" --body-file "$body" ;;
            comment)
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$body" ;;
            reopen)
              gh issue reopen "$number" --repo "$GITHUB_REPOSITORY"
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$body" ;;
            close)
              gh issue comment "$number" --repo "$GITHUB_REPOSITORY" --body-file "$body"
              gh issue close "$number" --repo "$GITHUB_REPOSITORY" --reason completed ;;
            *)
              echo "freshness_issue.py returned an unknown action: $action" >&2
              exit 1 ;;
          esac
          add_label="$(jq -r .add_label "$decision")"
          if [ -n "$add_label" ]; then
            gh issue edit "$number" --repo "$GITHUB_REPOSITORY" \
              --add-label "$add_label" --remove-label "$(jq -r .remove_label "$decision")"
          fi
