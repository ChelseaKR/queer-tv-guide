name: ci

# PR-gating checks. Two independent lanes, each real:
#
#   pipeline  -- `make pipeline`: the lockfile check, then pipeline/Makefile's
#                own gate (lint and the offline pytest suite; no network --
#                the fetch/build commands that talk to LezWatch/TVmaze are
#                not run here, see snapshot.yml for the nightly mirror).
#   guidecore -- `swift test` on the ios/GuideCore Swift package (no
#                external SwiftPM dependencies; its only network use is
#                `make -C ios bundle-snapshot`, one GET of the app's own
#                published snapshot). Deliberately NOT `xcodebuild`: the full
#                QueerTVGuide app target (and its UI tests) needs simulator
#                provisioning and a signing/scheme setup this repo hasn't
#                proven out in CI yet, and a flaky xcodebuild lane is worse
#                than none. GuideCore holds all of the app's logic; the UI
#                layer is thin SwiftUI views over it. Revisit xcodebuild
#                once the scheme is confirmed to build headlessly on a
#                runner.
#
# Both jobs run root Makefile targets, the same commands `make verify` runs
# locally (CI-CD §9, CICD-27; tests/test_ci_parity.py). There used to be a
# per-job "is my directory on this branch?" check that reported green when
# the directory was missing. It was right while pipeline/ and ios/ lived on
# separate branches; with both on main it meant deleting a directory would
# turn its check green without running anything, so it is gone (#11).
#
# guidecore needs macOS (GuideCore uses Apple's Foundation networking types,
# which do not build on Linux), and CI-CD §11b keeps macOS off per-PR CI for
# cost. docs/adr/0012 records the exception: the `changes` job skips
# guidecore on a pull request that touches nothing it tests, and runs it in
# every other case, including when `changes` itself fails.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # One group per commit on push, one per branch on a pull request (CI-CD
  # §11c): a ref-only key lets a third push evict a pending run, and that
  # commit then carries no verdict at all.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.12"

      - name: make pipeline (offline; fixtures only)
        run: make pipeline

  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      guidecore: ${{ steps.scope.outputs.guidecore }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: does this change touch anything guidecore tests?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "guidecore=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A failed diff fails this step, and guidecore then runs anyway.
          # No `grep -q` in a pipe: under pipefail its early exit can turn a
          # match into a failure, which would read as "nothing changed".
          changed="$(git diff --name-only "$BASE...$HEAD")"
          run=false
          while IFS= read -r path; do
            case "$path" in
              ios/* | schema/* | Makefile | .github/workflows/ci.yml) run=true ;;
            esac
          done <<< "$changed"
          printf '%s\n' "$changed"
          echo "guidecore=$run" >> "$GITHUB_OUTPUT"

  guidecore:
    name: guidecore
    needs: changes
    # Skipped only on a clean "false" from `changes`; a failed or cancelled
    # scope step runs the tests rather than skipping them.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.guidecore != 'false') }}
    runs-on: macos-14
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `make guidecore` runs `make -C ios package-test`, which first fetches
      # and checksum-verifies the app's bundled snapshot (gitignored; a copy
      # of the published file) so BundledSnapshotTests check real, published
      # data. One GET to the app's own Pages URL; no source is contacted.
      - name: swift test (GuideCore)
        run: make guidecore
