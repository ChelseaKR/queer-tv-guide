name: ci

# PR-gating checks. Two independent lanes, each real:
#
#   pipeline  -- `make pipeline`: the lockfile check, then pipeline/Makefile's
#                own gate (lint and the offline pytest suite; no network --
#                the fetch/build commands that talk to LezWatch/TVmaze are
#                not run here, see snapshot.yml for the nightly mirror).
#   guidecore -- `make guidecore`: `swift test` on the ios/GuideCore Swift
#                package (no external SwiftPM dependencies; its only network
#                use is `make -C ios bundle-snapshot`, one GET of the app's
#                own published snapshot). Then `make a11y`: the app's
#                accessibility gate (#22), AccessibilityAuditTests in the iOS
#                simulator. It runs Xcode's accessibility audit over every
#                screen and checks that a closed "does she die" answer is not
#                in the accessibility tree, where VoiceOver could read it. A
#                new audit finding fails the job. Simulator builds need no
#                signing. Only that test class runs here; the rest of the UI
#                suite is local (`make -C ios test-ui`).
#
#                The job is pinned to the Xcode and iOS versions the audit
#                was proven on (macos-26, Xcode 26.6, iOS 26.5; ios/Makefile
#                says why). The job name stays `guidecore` because the
#                protect-main ruleset requires that check by name
#                (.github/rulesets/main.json).
#
# Both jobs run root Makefile targets, the same commands `make verify` runs
# locally (CI-CD §9, CICD-27; tests/test_ci_parity.py). There used to be a
# per-job "is my directory on this branch?" check that reported green when
# the directory was missing. It was right while pipeline/ and ios/ lived on
# separate branches; with both on main it meant deleting a directory would
# turn its check green without running anything, so it is gone (#11).
#
# guidecore needs macOS (GuideCore uses Apple's Foundation networking types,
# which do not build on Linux), and CI-CD §11b keeps macOS off per-PR CI for
# cost. docs/adr/0012 records the exception: the `changes` job skips
# guidecore on a pull request that touches nothing it tests, and runs it in
# every other case, including when `changes` itself fails.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  # One group per commit on push, one per branch on a pull request (CI-CD
  # §11c): a ref-only key lets a third push evict a pending run, and that
  # commit then carries no verdict at all.
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

jobs:
  pipeline:
    name: pipeline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.12"

      - name: make pipeline (offline; fixtures only)
        run: make pipeline

      # Owner items that block App Store submission: TODO(owner) markers in
      # what gets published or submitted (docs/APP-STORE.md, "Before
      # submission"). Reported as warning annotations on every run, never a
      # failure; they are owner decisions, not code defects. Here because
      # this job always runs.
      - name: pre-submission owner items (warning only)
        run: |
          set -euo pipefail
          if ! make -C ios presubmit-check; then
            grep -rnF "TODO(owner)" docs/site docs/app-store-listing.json | while IFS=: read -r file line _; do
              echo "::warning file=${file},line=${line}::Unresolved TODO(owner): blocks App Store submission (docs/APP-STORE.md, Before submission)"
            done
          fi

  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      guidecore: ${{ steps.scope.outputs.guidecore }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: does this change touch anything guidecore tests?
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "guidecore=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # A failed diff fails this step, and guidecore then runs anyway.
          # No `grep -q` in a pipe: under pipefail its early exit can turn a
          # match into a failure, which would read as "nothing changed".
          changed="$(git diff --name-only "$BASE...$HEAD")"
          run=false
          while IFS= read -r path; do
            case "$path" in
              ios/* | schema/* | Makefile | .github/workflows/ci.yml) run=true ;;
            esac
          done <<< "$changed"
          printf '%s\n' "$changed"
          echo "guidecore=$run" >> "$GITHUB_OUTPUT"

  guidecore:
    name: guidecore
    needs: changes
    # Skipped only on a clean "false" from `changes`; a failed or cancelled
    # scope step runs the tests rather than skipping them.
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.guidecore != 'false') }}
    runs-on: macos-26
    # Measured locally: the GuideCore tests take under a minute and the 11
    # audit tests about 3, plus the simulator build. The margin covers a
    # cold build and simulator boot on the runner; a timeout reads as
    # "cancelled", not "failed", so it must sit well above the real run time.
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.6.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `make guidecore` runs `make -C ios package-test`, which first fetches
      # and checksum-verifies the app's bundled snapshot (gitignored; a copy
      # of the published file) so BundledSnapshotTests check real, published
      # data. One GET to the app's own Pages URL; no source is contacted.
      - name: swift test (GuideCore)
        run: make guidecore

      # Xcode's accessibility audit and the spoiler-under-VoiceOver checks,
      # one test at a time on one simulator (ios/Makefile, test-a11y).
      - name: accessibility audit (simulator)
        run: make a11y
