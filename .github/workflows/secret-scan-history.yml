name: secret-scan-history

# Gate 3 of SECURITY-AND-SUPPLY-CHAIN-STANDARD §4 (SEC-19): a scheduled
# TruffleHog scan of the full git history, reporting all three result tiers.
#
# `unverified` is the tier that matters most here. It means TruffleHog asked
# the provider and was told no, which is what a leaked credential looks like
# after it has been revoked. `--only-verified` and `--results=verified,unknown`
# both drop that tier and so cannot fail on a cleaned-up leak (measured across
# the portfolio on 2026-09-06). A placeholder that fires is excluded by
# detector name (--exclude-detectors), never by narrowing the tiers.
#
# The binary is downloaded and SHA-256-checked rather than run through the
# trufflehog action: the action's `version:` input picks the scanner, and a
# bot that bumps the action's SHA does not bump that input.
#
# The job proves it can fail before it scans: it plants a real-shaped key in
# one commit of a scratch repository, deletes it in the next, and requires
# TruffleHog to report it from history.

on:
  schedule:
    - cron: "41 13 * * 1" # Mondays 13:41 UTC, off the hour
  workflow_dispatch: {}
  # Also when this file changes, so an edit is proven on its own pull request
  # rather than first running on a schedule after merge.
  pull_request:
    branches: [main]
    paths: [".github/workflows/secret-scan-history.yml"]
  push:
    branches: [main]
    paths: [".github/workflows/secret-scan-history.yml"]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

jobs:
  trufflehog:
    name: trufflehog history scan
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      TRUFFLEHOG_VERSION: "3.97.4"
      # From trufflehog_3.97.4_checksums.txt on the v3.97.4 release, 2026-09-17.
      TRUFFLEHOG_SHA256: "dc24007c2f233bd61c05beabeb44aa27ea9b43288166279209abe0458c5ce76b"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Every commit, or the "full-history" scan is a one-commit scan that
          # still reports success.
          fetch-depth: 0
          persist-credentials: false

      - name: install the pinned scanner
        run: |
          set -euo pipefail
          asset="trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL \
            "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/${asset}" \
            -o "$RUNNER_TEMP/$asset"
          echo "${TRUFFLEHOG_SHA256}  $RUNNER_TEMP/$asset" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/trufflehog"
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/trufflehog" trufflehog
          "$RUNNER_TEMP/trufflehog/trufflehog" --version

      - name: negative control (a revoked-shaped key in history must be found)
        run: |
          set -euo pipefail
          scratch="$RUNNER_TEMP/planted"
          git init -q "$scratch"
          git -C "$scratch" config user.email ci@example.invalid
          git -C "$scratch" config user.name ci
          # Assembled from short pieces so this workflow file does not itself
          # carry a key for gitleaks or TruffleHog to find. Shaped like a real
          # AWS key pair, not AWS's documented example (TruffleHog skips
          # those, and the control would pass by skipping).
          p1="AKIA"; p2="Z3MSJV4WWRQ7XK5T"
          b1="Qm8xR2vT"; b2="9pL4kW7n"; b3="B3cY6hJ1"; b4="dF5gS0aZ"; b5="uE2iO8tK"
          printf 'aws_access_key_id = %s%s\naws_secret_access_key = %s%s%s%s%s\n' \
            "$p1" "$p2" "$b1" "$b2" "$b3" "$b4" "$b5" > "$scratch/creds.txt"
          grep -q "^aws_access_key_id = AKIA" "$scratch/creds.txt"
          git -C "$scratch" add creds.txt
          git -C "$scratch" commit -qm plant
          git -C "$scratch" rm -q creds.txt
          git -C "$scratch" commit -qm unplant
          test ! -e "$scratch/creds.txt"
          test "$(git -C "$scratch" log --oneline | wc -l)" -eq 2
          rc=0
          "$RUNNER_TEMP/trufflehog/trufflehog" git "file://$scratch" \
            --results=verified,unknown,unverified --fail --no-update --json > "$RUNNER_TEMP/control.json" || rc=$?
          # 183 is TruffleHog's "found results" exit code under --fail.
          if [ "$rc" -ne 183 ]; then
            echo "control: expected exit 183 (key found in history), got $rc" >&2
            exit 1
          fi
          found="$(grep -c '"DetectorName"' "$RUNNER_TEMP/control.json")"
          echo "control: TruffleHog reported $found result(s) for the planted key"

      - name: scan the full history, every result tier
        run: |
          set -euo pipefail
          test "$(git rev-list --count HEAD)" -gt 1
          "$RUNNER_TEMP/trufflehog/trufflehog" git "file://$GITHUB_WORKSPACE" \
            --results=verified,unknown,unverified --fail --no-update
