name: QueerTVGuide
options:
  bundleIdPrefix: com.chelseakr
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: false

packages:
  GuideCore:
    path: GuideCore

targets:
  QueerTVGuide:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/App-Debug.xcconfig
      Release: Config/App-Release.xcconfig
    sources:
      - path: QueerTVGuide
        excludes:
          - "Resources/snapshot.v1.json"
      - path: QueerTVGuide/Resources/snapshot.v1.json
        buildPhase: resources
      - path: QueerTVGuide/PrivacyInfo.xcprivacy
        buildPhase: resources
    # The App Group the app shares with the widget: the app writes the
    # widget's one file there (GuideCore's UpNext). Local to the device.
    entitlements:
      path: QueerTVGuide/QueerTVGuide.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.chelseakr.queertvguide
    dependencies:
      - package: GuideCore
        product: GuideCore
      - target: QueerTVGuideWidgets
    settings:
      base:
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES

  # The "Up Next" home-screen widget. It reads the one file the app writes
  # into the shared App Group container and makes no network request.
  QueerTVGuideWidgets:
    type: app-extension
    platform: iOS
    configFiles:
      Debug: Config/Widgets-Debug.xcconfig
      Release: Config/Widgets-Release.xcconfig
    sources:
      - path: QueerTVGuideWidgets
        excludes:
          - "PrivacyInfo.xcprivacy"
          - "Info.plist"
      - path: QueerTVGuideWidgets/PrivacyInfo.xcprivacy
        buildPhase: resources
    info:
      path: QueerTVGuideWidgets/Info.plist
      properties:
        # An extension's versions must match its app's (App Store validation).
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: QueerTVGuideWidgets/QueerTVGuideWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.chelseakr.queertvguide
    dependencies:
      - package: GuideCore
        product: GuideCore

  QueerTVGuideTests:
    type: bundle.unit-test
    platform: iOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: QueerTVGuideTests
      # The widget's views, so WidgetRenderTests can draw them.
      - path: QueerTVGuideWidgets/UpNextWidgetView.swift
    dependencies:
      - target: QueerTVGuide
      # GuideCore is already statically linked into the host app this test
      # bundle runs inside; linking it again here duplicates the library
      # (Xcode errors on this). `link: false` gives compile-time module
      # access (`import GuideCore`) without a second link.
      - package: GuideCore
        product: GuideCore
        link: false

  QueerTVGuideUITests:
    type: bundle.ui-testing
    platform: iOS
    configFiles:
      Debug: Config/Debug.xcconfig
      Release: Config/Release.xcconfig
    sources:
      - path: QueerTVGuideUITests
    dependencies:
      - target: QueerTVGuide

schemes:
  QueerTVGuide:
    build:
      targets:
        QueerTVGuide: all
        QueerTVGuideTests: [test]
        QueerTVGuideUITests: [test]
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - QueerTVGuideTests
        - QueerTVGuideUITests
    run:
      config: Debug
    archive:
      config: Release
