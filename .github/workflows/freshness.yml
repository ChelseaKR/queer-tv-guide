name: freshness

# The staleness alarm for the published snapshot (DATA-GOVERNANCE-STANDARD
# DG-04, #25). Every 6 hours it fetches the file the app reads and the
# nightly `snapshot.yml` run history, and scripts/check_snapshot_freshness.py
# judges them:
#
#   - the file is older than 30 hours (a nightly run was missed): SEV3;
#   - the file is older than the data cards' 48-hour SLA: SEV2;
#   - the last completed nightly run on main did not succeed: SEV3;
#   - the file cannot be fetched or dated, or there is no run history: an
#     alarm too, because an unknown age is never "fresh".
#
# An alarm turns this run red and, on a scheduled or dispatched run, opens an
# `incident` issue with its severity label, as docs/incidents/README.md asks.
# While that issue is open, later runs comment only when the situation
# changes (a new file, a new nightly run, a new severity), and once the file
# is fresh again they note it there. Closing the issue is a person's job,
# after the postmortem.
#
# The script's thresholds are tested against snapshot.yml's schedule and the
# data cards (tests/test_snapshot_freshness.py, run by `make policy`). Before
# it checks anything, the job proves it can fail: a planted 2020 snapshot
# must make the script exit 1.

on:
  schedule:
    - cron: "47 */6 * * *" # 00:47, 06:47, 12:47, 18:47 UTC; off the hour
  workflow_dispatch: {}
  # Also when the check itself changes, so an edit is proven on its own pull
  # request. Those runs never open issues.
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/freshness.yml"
      - "scripts/check_snapshot_freshness.py"
      - "tests/test_snapshot_freshness.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/freshness.yml"
      - "scripts/check_snapshot_freshness.py"
      - "tests/test_snapshot_freshness.py"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

env:
  SNAPSHOT_URL: https://chelseakr.github.io/queer-tv-guide/snapshot.v1.json

jobs:
  check:
    name: snapshot freshness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read # the snapshot workflow's run history (a private repository)
      issues: write # open or update the incident issue
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: self-test the checker
        run: python3 -m unittest discover --start-directory tests --pattern test_snapshot_freshness.py --verbose

      - name: negative control (a planted 2020 snapshot must raise the alarm)
        run: |
          set -euo pipefail
          control="$RUNNER_TEMP/control"
          mkdir -p "$control"
          printf '{"generated_at": "2020-01-01T00:00:00Z"}\n' > "$control/snapshot.json"
          printf '[{"databaseId": 1, "status": "completed", "conclusion": "success", "event": "schedule", "createdAt": "2020-01-01T00:00:00Z", "url": "none"}]\n' > "$control/runs.json"
          grep -qF '"2020-01-01T00:00:00Z"' "$control/snapshot.json"
          rc=0
          python3 scripts/check_snapshot_freshness.py \
            --snapshot "$control/snapshot.json" --runs "$control/runs.json" \
            --report "$control/report.md" > /dev/null || rc=$?
          if [ "$rc" -ne 1 ]; then
            echo "control: a 2020 snapshot must alarm (exit 1), got exit $rc" >&2
            exit 1
          fi
          grep -qF "ALARM (sev2)" "$control/report.md"
          echo "control: the planted 2020 snapshot raised a sev2 alarm"

      - name: fetch the published snapshot and the nightly run history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # A failed fetch leaves no file, which the checker judges as an
          # unknown age: an alarm, never a pass.
          if ! curl --proto '=https' --tlsv1.2 -fsS --compressed --retry 3 --retry-all-errors \
              --max-time 120 -o "$RUNNER_TEMP/snapshot.v1.json" "$SNAPSHOT_URL"; then
            echo "::warning::could not fetch $SNAPSHOT_URL"
            rm -f "$RUNNER_TEMP/snapshot.v1.json"
          fi
          if ! gh run list --repo "$GITHUB_REPOSITORY" --workflow snapshot.yml --branch main --limit 20 \
              --json databaseId,status,conclusion,event,createdAt,url > "$RUNNER_TEMP/runs.json"; then
            echo "::warning::could not read the snapshot workflow's run history"
            rm -f "$RUNNER_TEMP/runs.json"
          fi

      - name: judge freshness
        id: verdict
        run: |
          set -euo pipefail
          rc=0
          python3 scripts/check_snapshot_freshness.py \
            --snapshot "$RUNNER_TEMP/snapshot.v1.json" --runs "$RUNNER_TEMP/runs.json" \
            --report "$RUNNER_TEMP/report.md" --github-output "$GITHUB_OUTPUT" || rc=$?
          cat "$RUNNER_TEMP/report.md" >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"

      - name: open or update the incident issue
        if: ${{ failure() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        env:
          GH_TOKEN: ${{ github.token }}
          SEVERITY: ${{ steps.verdict.outputs.severity }}
          TITLE: ${{ steps.verdict.outputs.title }}
          FINGERPRINT: ${{ steps.verdict.outputs.fingerprint }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          report="$RUNNER_TEMP/report.md"
          # A job that failed before reaching a verdict (a broken self-test,
          # a crashed checker) is a silenced gate: SEV3, per the README.
          if [ -z "$SEVERITY" ] || [ ! -s "$report" ]; then
            SEVERITY="sev3"
            TITLE="snapshot freshness: the check could not reach a verdict"
            FINGERPRINT="no-verdict-$GITHUB_RUN_ID"
            printf '## Snapshot freshness: no verdict\n\nThe freshness job failed before it could judge the published snapshot, so its age is unknown.\n\n<!-- freshness-fingerprint: %s -->\n' \
              "$FINGERPRINT" > "$report"
          fi
          printf '\nRun: %s\n' "$RUN_URL" >> "$report"
          open_issues="$RUNNER_TEMP/open-incidents.json"
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --label incident --limit 100 \
            --json number,title > "$open_issues"
          existing="$(jq -r '[.[] | select(.title | startswith("snapshot freshness:"))][0].number // empty' "$open_issues")"
          if [ -z "$existing" ]; then
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" \
              --label incident --label "$SEVERITY" --body-file "$report"
            exit 0
          fi
          history="$RUNNER_TEMP/issue-history.txt"
          gh issue view "$existing" --repo "$GITHUB_REPOSITORY" --json body,comments,labels \
            --jq '.body, .comments[].body, (.labels[].name | "label: " + .)' > "$history"
          if grep -qF "freshness-fingerprint: $FINGERPRINT" "$history"; then
            echo "#$existing already records this state; no new comment"
          else
            gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$report"
          fi
          if [ "$SEVERITY" = "sev2" ] && ! grep -qx "label: sev2" "$history"; then
            gh issue edit "$existing" --repo "$GITHUB_REPOSITORY" --add-label sev2 --remove-label sev3
          fi

      - name: note recovery on an open freshness incident
        if: ${{ success() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') }}
        env:
          GH_TOKEN: ${{ github.token }}
          GENERATED_AT: ${{ steps.verdict.outputs.generated_at }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          open_issues="$RUNNER_TEMP/open-incidents.json"
          gh issue list --repo "$GITHUB_REPOSITORY" --state open --label incident --limit 100 \
            --json number,title > "$open_issues"
          existing="$(jq -r '[.[] | select(.title | startswith("snapshot freshness:"))][0].number // empty' "$open_issues")"
          if [ -z "$existing" ]; then
            echo "no open freshness incident"
            exit 0
          fi
          marker="freshness-fingerprint: recovered-$GENERATED_AT"
          history="$RUNNER_TEMP/issue-history.txt"
          gh issue view "$existing" --repo "$GITHUB_REPOSITORY" --json body,comments \
            --jq '.body, .comments[].body' > "$history"
          if grep -qF "$marker" "$history"; then
            echo "#$existing already records this recovery"
            exit 0
          fi
          printf 'Fresh again: the published snapshot was generated at %s and the last nightly run succeeded (%s). Close this issue once the postmortem is in docs/incidents/.\n\n<!-- %s -->\n' \
            "$GENERATED_AT" "$RUN_URL" "$marker" > "$RUNNER_TEMP/recovered.md"
          gh issue comment "$existing" --repo "$GITHUB_REPOSITORY" --body-file "$RUNNER_TEMP/recovered.md"
