[project]
name = "qtv-pipeline"
version = "0.1.0"
description = "Mirrors LezWatch.TV and TVmaze into the queer-tv-guide snapshot. No users, no telemetry."
requires-python = ">=3.12"
readme = "README.md"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.23",
]

[project.scripts]
qtv = "qtv_pipeline.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qtv_pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# fixture-heavy literal dicts read better on one line than wrapped
"tests/*" = ["E501"]
